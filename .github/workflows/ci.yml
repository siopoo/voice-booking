name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PAWPILOT_LLM_API_KEY: ""
      PAWPILOT_LLM_MODEL: ""
      PAWPILOT_STT_API_KEY: ""
      PAWPILOT_STT_MODEL: ""
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app evals tests *.py
      - name: Unit and integration tests
        run: pytest -q
      - name: Deterministic Agent evals
        run: python -m evals.run_evals
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend tests
        run: npm test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t pawpilot:ci .
